name: Publish

# build.yml drafts a release for every green push to main; publishing that draft is the release
# decision, and this pushes the package it carries to NuGet.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Push to NuGet
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the packages from the release
        run: gh release download "$TAG" --pattern '*.nupkg' --dir package

      # The draft carried the packages built from that commit; a tag that disagrees with either means
      # the release was assembled by hand, and pushing a wrong version to NuGet cannot be undone.
      - name: Check the packages match the tag
        id: packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          for id in DeepEquals.SourceGeneration.Framework DeepEquals.SourceGenerator; do
            matches=()
            for nupkg in package/"$id".*.nupkg; do
              # The framework id is not a prefix of the analyzer's, but be explicit: what follows the
              # id must be the version separator and a digit.
              rest=$(basename "$nupkg" .nupkg)
              rest=${rest#"$id".}
              case "$rest" in [0-9]*) matches+=("$nupkg") ;; esac
            done
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one $id package on release $TAG, found ${#matches[@]}:" >&2
              for match in "${matches[@]}"; do echo "  $match" >&2; done
              exit 1
            fi
            version=$(basename "${matches[0]}" .nupkg)
            version=v${version#"$id".}
            if [ "$version" != "$TAG" ]; then
              echo "$id is $version but the release is tagged $TAG" >&2
              exit 1
            fi
            case "$id" in
              *.Framework) echo "framework=${matches[0]}" >> "$GITHUB_OUTPUT" ;;
              *) echo "analyzer=${matches[0]}" >> "$GITHUB_OUTPUT" ;;
            esac
            echo "Publishing $id $version"
          done

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Get a short-lived NuGet API key
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # The runtime library goes first: the analyzer package depends on it, and a consumer restoring in
      # the window between the two pushes should not find an analyzer whose dependency is missing.
      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          FRAMEWORK: ${{ steps.packages.outputs.framework }}
          ANALYZER: ${{ steps.packages.outputs.analyzer }}
        run: |
          set -euo pipefail
          for package in "$FRAMEWORK" "$ANALYZER"; do
            dotnet nuget push "$package" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" \
              --skip-duplicate
          done
